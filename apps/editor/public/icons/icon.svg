<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- App Background Icon -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>
  
  <!-- Sheet Surface with shadow -->
  <g filter="url(#shadow)">
    <path d="M144 112 H304 L368 176 V400 C368 408 360 416 352 416 H144 C136 416 128 408 128 400 V128 C128 120 136 112 144 112 Z" fill="#ffffff"/>
    <path d="M304 112 V164 C304 172 312 176 320 176 H368 Z" fill="url(#fold)"/>
  </g>
  
  <!-- Distinctive RhyPDF Ribbon / Wave / Quill Mark (Cyan / Cobalt, No Adobe Red) -->
  <path d="M168 220 C200 210, 240 240, 280 224 C310 212, 330 220, 344 228" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" fill="none"/>
  
  <!-- Sleek typography lines -->
  <rect x="168" y="264" width="176" height="14" rx="7" fill="#64748b"/>
  <rect x="168" y="298" width="136" height="14" rx="7" fill="#94a3b8"/>
  <rect x="168" y="332" width="156" height="14" rx="7" fill="#cbd5e1"/>
  
  <!-- Secure Client-Side Shield / Dot indicator -->
  <circle cx="334" cy="366" r="10" fill="#10b981"/>
</svg>
